name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # 앱에서 저장(db/·uploads/)할 때마다 재배포할 필요는 없다 (앱이 GitHub에서 바로 읽음)
    paths-ignore:
      - "db/**"
      - "uploads/**"
  # 데이터 업데이트 봇의 커밋은 push 이벤트를 만들지 않아서 workflow_run 으로 이어받습니다.
  workflow_run:
    workflows: ["Update CJ Data"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # 1) 빌드해서 Pages 아티팩트 올리기
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "./frontend/package-lock.json"

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_GH_REPO: ${{ github.repository }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: "./frontend/dist"

  # 2) 배포 (GitHub 공식 Pages 템플릿처럼 별도 job으로 분리)
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
